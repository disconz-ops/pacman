<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Land Plot Layout Tool</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #1e1e2e;
  color: #cdd6f4;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

header {
  background: #181825;
  border-bottom: 1px solid #313244;
  padding: 7px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
  user-select: none;
}
header h1 {
  font-size: 13px;
  font-weight: 700;
  color: #89b4fa;
  letter-spacing: 0.3px;
}
.sep { width: 1px; height: 20px; background: #313244; }

button {
  background: #313244;
  color: #cdd6f4;
  border: 1px solid #45475a;
  padding: 4px 11px;
  border-radius: 4px;
  font-size: 11px;
  cursor: pointer;
  transition: background 0.1s, border-color 0.1s;
  white-space: nowrap;
}
button:hover { background: #45475a; }
button.primary { background: #89b4fa; color: #1e1e2e; border-color: #89b4fa; font-weight: 600; }
button.primary:hover { background: #74c7ec; border-color: #74c7ec; }
button.danger { background: transparent; color: #f38ba8; border-color: #f38ba8; }
button.danger:hover { background: #f38ba820; }
.header-right { margin-left: auto; display: flex; gap: 6px; }

.main { display: flex; flex: 1; overflow: hidden; }

.sidebar-left {
  width: 52px;
  background: #181825;
  border-right: 1px solid #313244;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px 0;
  gap: 2px;
  flex-shrink: 0;
}
.tool-btn {
  width: 38px; height: 38px;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  background: transparent;
  border: 1px solid transparent;
  padding: 0;
  font-size: 17px;
  color: #6c7086;
  transition: all 0.1s;
  position: relative;
}
.tool-btn:hover { background: #313244; color: #cdd6f4; border-color: #45475a; }
.tool-btn.active { background: #89b4fa22; color: #89b4fa; border-color: #89b4fa66; }
.tool-tip {
  position: absolute;
  left: 46px; top: 50%;
  transform: translateY(-50%);
  background: #313244;
  color: #cdd6f4;
  border: 1px solid #45475a;
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 11px;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.1s;
  z-index: 200;
}
.tool-btn:hover .tool-tip { opacity: 1; }
.tool-div { width: 30px; height: 1px; background: #313244; margin: 4px 0; }

.canvas-wrap {
  flex: 1;
  position: relative;
  overflow: hidden;
  background: #11111b;
}
#canvas { display: block; }
.coord-info {
  position: absolute; bottom: 8px; left: 8px;
  background: #181825cc;
  border: 1px solid #313244;
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 11px;
  color: #6c7086;
  pointer-events: none;
  font-family: monospace;
}

.sidebar-right {
  width: 256px;
  background: #181825;
  border-left: 1px solid #313244;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  flex-shrink: 0;
}
.panel { border-bottom: 1px solid #313244; }
.panel-hdr {
  padding: 7px 12px;
  font-size: 10px;
  font-weight: 700;
  color: #6c7086;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  background: #181825;
}
.panel-body { padding: 8px 12px; }

.param-row {
  display: flex; align-items: center;
  margin-bottom: 5px; gap: 6px;
}
.param-row label { font-size: 11px; color: #a6adc8; flex: 1; min-width: 0; }
.param-row input[type="number"] {
  width: 64px;
  background: #313244; border: 1px solid #45475a;
  color: #cdd6f4; padding: 3px 6px;
  border-radius: 3px; font-size: 11px;
  flex-shrink: 0;
}
.param-row input[type="number"]:focus { outline: none; border-color: #89b4fa; }
.param-unit { font-size: 10px; color: #585b70; width: 18px; flex-shrink: 0; }

.summary-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 4px; font-size: 11px;
}
.summary-grid .lbl { color: #6c7086; }
.summary-grid .val { color: #cdd6f4; font-weight: 600; text-align: right; }

.plot-list-wrap { flex: 1; overflow-y: auto; }
.plot-item {
  display: flex; align-items: center;
  padding: 5px 10px; gap: 8px;
  cursor: pointer; font-size: 11px;
  transition: background 0.08s;
  border-bottom: 1px solid #1e1e2e;
}
.plot-item:hover { background: #252535; }
.plot-item.sel { background: #89b4fa12; }
.plot-badge {
  width: 24px; height: 24px; border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 10px; flex-shrink: 0;
}
.plot-info { flex: 1; min-width: 0; }
.plot-area-text { color: #cdd6f4; }
.plot-dim-text { color: #585b70; font-size: 10px; }
.del-btn {
  background: transparent; border: none; color: #585b70;
  font-size: 13px; padding: 1px 4px; cursor: pointer; border-radius: 2px;
}
.del-btn:hover { background: #f38ba820; color: #f38ba8; }

.statusbar {
  background: #181825; border-top: 1px solid #313244;
  padding: 3px 12px; font-size: 11px; color: #6c7086;
  display: flex; gap: 16px; flex-shrink: 0; align-items: center;
}
.statusbar .sv { color: #89b4fa; }
#status-msg { margin-left: auto; }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #45475a; border-radius: 3px; }
</style>
</head>
<body>

<header>
  <h1>Land Plot Layout Tool</h1>
  <div class="sep"></div>
  <button onclick="T.undo()">&#8617; Undo</button>
  <button onclick="T.redo()">&#8618; Redo</button>
  <button class="danger" onclick="T.clearAll()">&#128465; Clear</button>
  <div class="sep"></div>
  <button onclick="T.fitView()">&#9654; Fit View</button>
  <div class="header-right">
    <button class="primary" onclick="T.autoLayout()">&#9889; Auto-Layout Plots</button>
    <button onclick="T.exportDXF()">&#128208; Export DXF</button>
  </div>
</header>

<div class="main">
  <div class="sidebar-left">
    <button class="tool-btn active" id="tb-select" onclick="T.setTool('select')">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
        <path d="M2 2l5 12 2-5 5-2z"/>
      </svg>
      <span class="tool-tip">Select &nbsp;[S]</span>
    </button>
    <div class="tool-div"></div>
    <button class="tool-btn" id="tb-boundary" onclick="T.setTool('boundary')">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="2" width="12" height="12" stroke-dasharray="3 1.5"/>
      </svg>
      <span class="tool-tip">Site Boundary &nbsp;[B]</span>
    </button>
    <div class="tool-div"></div>
    <button class="tool-btn" id="tb-road-h" onclick="T.setTool('road-h')">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
        <rect x="0" y="6" width="16" height="4" rx="1"/>
        <rect x="3" y="7.5" width="2" height="1" fill="#181825"/>
        <rect x="7" y="7.5" width="2" height="1" fill="#181825"/>
        <rect x="11" y="7.5" width="2" height="1" fill="#181825"/>
      </svg>
      <span class="tool-tip">Horizontal Road &nbsp;[H]</span>
    </button>
    <button class="tool-btn" id="tb-road-v" onclick="T.setTool('road-v')">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
        <rect x="6" y="0" width="4" height="16" rx="1"/>
        <rect x="7.5" y="3" width="1" height="2" fill="#181825"/>
        <rect x="7.5" y="7" width="1" height="2" fill="#181825"/>
        <rect x="7.5" y="11" width="1" height="2" fill="#181825"/>
      </svg>
      <span class="tool-tip">Vertical Road &nbsp;[V]</span>
    </button>
    <div class="tool-div"></div>
    <button class="tool-btn" id="tb-plot" onclick="T.setTool('plot')">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="2" y="2" width="12" height="12"/>
        <text x="8" y="10" font-size="6" text-anchor="middle" fill="currentColor" stroke="none">LOT</text>
      </svg>
      <span class="tool-tip">Manual Plot &nbsp;[P]</span>
    </button>
    <div class="tool-div"></div>
    <button class="tool-btn" id="tb-pan" onclick="T.setTool('pan')">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 1v3M8 12v3M1 8h3M12 8h3M8 6a2 2 0 100 4 2 2 0 000-4z"/>
      </svg>
      <span class="tool-tip">Pan &nbsp;[Space]</span>
    </button>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="canvas"></canvas>
    <div class="coord-info" id="coordInfo">0.0, 0.0 m</div>
  </div>

  <div class="sidebar-right">
    <div class="panel">
      <div class="panel-hdr">Parameters</div>
      <div class="panel-body">
        <div class="param-row"><label>Min Area</label><input type="number" id="p-minArea" value="300" min="1"><span class="param-unit">m&#178;</span></div>
        <div class="param-row"><label>Max Area</label><input type="number" id="p-maxArea" value="800" min="1"><span class="param-unit">m&#178;</span></div>
        <div class="param-row"><label>Min Frontage</label><input type="number" id="p-minFront" value="12" min="1"><span class="param-unit">m</span></div>
        <div class="param-row"><label>Max Frontage</label><input type="number" id="p-maxFront" value="25" min="1"><span class="param-unit">m</span></div>
        <div class="param-row"><label>Min Depth</label><input type="number" id="p-minDepth" value="20" min="1"><span class="param-unit">m</span></div>
        <div class="param-row"><label>Max Depth</label><input type="number" id="p-maxDepth" value="40" min="1"><span class="param-unit">m</span></div>
        <div class="param-row"><label>Road Width</label><input type="number" id="p-roadW" value="10" min="1"><span class="param-unit">m</span></div>
        <div class="param-row"><label>Lot # Start</label><input type="number" id="p-startN" value="1" min="1"><span class="param-unit"></span></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-hdr">Summary</div>
      <div class="panel-body" id="summary">
        <div style="font-size:11px;color:#585b70">Draw a site boundary to begin.</div>
      </div>
    </div>

    <div class="panel" style="flex:1;display:flex;flex-direction:column;border-bottom:none;overflow:hidden">
      <div class="panel-hdr">Lots &amp; Roads</div>
      <div class="plot-list-wrap" id="plotList"></div>
    </div>
  </div>
</div>

<div class="statusbar">
  <span>Tool: <span class="sv" id="st-tool">Select</span></span>
  <span>Cursor: <span class="sv" id="st-cursor">0.0, 0.0 m</span></span>
  <span>Lots: <span class="sv" id="st-lots">0</span></span>
  <span>Scale: <span class="sv" id="st-scale">1:500</span></span>
  <span id="status-msg"></span>
</div>

<script>
// ================================================================
// Land Plot Layout Tool
// All shapes stored as polygon point arrays { points:[{x,y},...] }
// so any corner can be dragged freely with the Select tool.
// ================================================================

const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
const wrap   = document.getElementById('canvasWrap');

// ── View ─────────────────────────────────────────────────────────
let scale = 8, offX = 80, offY = 80;

// ── Data ─────────────────────────────────────────────────────────
// Shapes: { id, points:[{x,y},...] }   (world metres)
// Plots additionally: { num, area, manual }
let boundary = null;
let roads    = [];
let plots    = [];
let selected = null;   // item id

// ── Interaction ──────────────────────────────────────────────────
let tool      = 'select';
let drawing   = false;
let dStart    = null;   // {wx,wy}
let dCur      = null;   // {wx,wy}
let panning   = false;
let panStart  = null;   // {sx,sy,ox,oy}
let spaceDown = false;
let dragNode  = null;   // {itemId, nodeIdx} – corner being dragged
let hoverNode = null;   // {itemId, nodeIdx} – corner under cursor

// ── History ──────────────────────────────────────────────────────
let history = [], histIdx = -1;
let _uid = 0;
function uid() { return 'u' + (++_uid); }

// ── Geometry ─────────────────────────────────────────────────────
function rectPts(x, y, w, h) {
  return [{x,y},{x:x+w,y},{x:x+w,y:y+h},{x,y:y+h}];
}
function bbox(pts) {
  const xs = pts.map(p=>p.x), ys = pts.map(p=>p.y);
  return { x:Math.min(...xs), y:Math.min(...ys),
           w:Math.max(...xs)-Math.min(...xs), h:Math.max(...ys)-Math.min(...ys) };
}
function polyArea(pts) {
  let a = 0; const n = pts.length;
  for (let i=0; i<n; i++) {
    const j = (i+1)%n;
    a += pts[i].x*pts[j].y - pts[j].x*pts[i].y;
  }
  return Math.abs(a)/2;
}
function ptInPoly(px, py, pts) {
  let inside = false; const n = pts.length;
  for (let i=0,j=n-1; i<n; j=i++) {
    const xi=pts[i].x,yi=pts[i].y,xj=pts[j].x,yj=pts[j].y;
    if (((yi>py)!==(yj>py)) && (px < (xj-xi)*(py-yi)/(yj-yi)+xi))
      inside = !inside;
  }
  return inside;
}
function centroid(pts) {
  return { x:pts.reduce((s,p)=>s+p.x,0)/pts.length,
           y:pts.reduce((s,p)=>s+p.y,0)/pts.length };
}
function sdist(ax,ay,bx,by) { return Math.hypot(ax-bx,ay-by); }

// ── Transforms ───────────────────────────────────────────────────
function w2s(wx,wy) { return {x:wx*scale+offX, y:wy*scale+offY}; }
function s2w(sx,sy) { return {wx:(sx-offX)/scale, wy:(sy-offY)/scale}; }
function snap(v,g=0.5){ return Math.round(v/g)*g; }

// ── History ──────────────────────────────────────────────────────
function saveSnap() {
  const s = JSON.stringify({boundary,roads,plots});
  history = history.slice(0, histIdx+1);
  history.push(s);
  histIdx = history.length-1;
}
function restoreSnap() {
  const s = JSON.parse(history[histIdx]);
  boundary=s.boundary; roads=s.roads; plots=s.plots;
  dragNode=null; hoverNode=null;
  refreshUI(); draw();
}
function undo() { if (histIdx>0)               { histIdx--; restoreSnap(); } }
function redo() { if (histIdx<history.length-1) { histIdx++; restoreSnap(); } }

// ── Tool ─────────────────────────────────────────────────────────
const TOOL_NAMES = {
  select:'Select', boundary:'Site Boundary',
  'road-h':'Horizontal Road','road-v':'Vertical Road',
  plot:'Manual Plot', pan:'Pan'
};
function setTool(t) {
  tool=t; dragNode=null; hoverNode=null;
  document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active'));
  const btn = document.getElementById('tb-'+t);
  if (btn) btn.classList.add('active');
  document.getElementById('st-tool').textContent = TOOL_NAMES[t]||t;
  wrap.style.cursor = t==='pan'?'grab': t==='select'?'default':'crosshair';
}

// ── Status ───────────────────────────────────────────────────────
function setMsg(msg, ok=true) {
  const el = document.getElementById('status-msg');
  el.textContent=msg; el.style.color=ok?'#a6e3a1':'#f38ba8';
  clearTimeout(el._t); el._t=setTimeout(()=>{el.textContent='';},3500);
}

// ── Item lookup ──────────────────────────────────────────────────
function findItem(id) {
  if (boundary&&boundary.id===id) return boundary;
  return plots.find(p=>p.id===id)||roads.find(r=>r.id===id)||null;
}

// ── Node hit detection ───────────────────────────────────────────
const NODE_R = 10; // screen px hit radius
function nodeAt(sx, sy) {
  if (!selected) return null;
  const item = findItem(selected);
  if (!item) return null;
  for (let i=0; i<item.points.length; i++) {
    const s = w2s(item.points[i].x, item.points[i].y);
    if (sdist(sx,sy,s.x,s.y)<=NODE_R) return i;
  }
  return null;
}

// ── Params ───────────────────────────────────────────────────────
function getP() {
  const g = id => +document.getElementById(id).value||0;
  return {
    minArea:  g('p-minArea') ||300,
    maxArea:  g('p-maxArea') ||800,
    minFront: g('p-minFront')||12,
    maxFront: g('p-maxFront')||25,
    minDepth: g('p-minDepth')||20,
    maxDepth: g('p-maxDepth')||40,
    roadW:    g('p-roadW')   ||10,
    startN:   g('p-startN')  ||1,
  };
}

// ── Auto-layout ──────────────────────────────────────────────────
function autoLayout() {
  if (!boundary) { setMsg('Draw a site boundary first.', false); return; }
  const p = getP();
  const bb = bbox(boundary.points);
  let blocks = [{x:bb.x, y:bb.y, w:bb.w, h:bb.h}];
  for (const road of roads) {
    const rb = bbox(road.points);
    const next = [];
    for (const bl of blocks) next.push(...subRect(bl,rb));
    blocks = next;
  }
  blocks = blocks.filter(b=>b.w>=p.minFront*0.8&&b.h>=p.minDepth*0.8);
  const newPlots = [];
  for (const bl of blocks) {
    for (const r of subdivide(bl,p)) {
      newPlots.push({id:uid(),num:0,points:rectPts(r.x,r.y,r.w,r.h),area:Math.round(r.w*r.h),manual:false});
    }
  }
  newPlots.forEach((pl,i)=>{ pl.num=p.startN+i; });
  saveSnap(); plots=newPlots;
  refreshUI(); draw();
  setMsg(`Auto-layout: ${newPlots.length} lot${newPlots.length!==1?'s':''} created.`);
}

function subRect(a, b) {
  const ax1=a.x,ax2=a.x+a.w,ay1=a.y,ay2=a.y+a.h;
  const bx1=b.x,bx2=b.x+b.w,by1=b.y,by2=b.y+b.h;
  if (bx2<=ax1||bx1>=ax2||by2<=ay1||by1>=ay2) return [a];
  const out=[];
  const ox1=Math.max(ax1,bx1),ox2=Math.min(ax2,bx2);
  if (bx1>ax1) out.push({x:ax1,y:ay1,w:bx1-ax1,h:a.h});
  if (bx2<ax2) out.push({x:bx2,y:ay1,w:ax2-bx2,h:a.h});
  if (by1>ay1) out.push({x:ox1,y:ay1,w:ox2-ox1,h:by1-ay1});
  if (by2<ay2) out.push({x:ox1,y:by2,w:ox2-ox1,h:ay2-by2});
  return out.filter(r=>r.w>0.1&&r.h>0.1);
}

function subdivide(bl, p) {
  const {minFront,maxFront,minDepth,maxDepth,minArea}=p;
  const landscape=bl.w>=bl.h;
  const blockFront=landscape?bl.w:bl.h;
  const blockDepth=landscape?bl.h:bl.w;
  if (blockDepth<minDepth*0.8) return [];
  const rows=(blockDepth>=maxDepth*1.8)?2:1;
  const rowDepth=blockDepth/rows;
  if (rowDepth<minDepth*0.8) return [];
  const ideal=(minFront+maxFront)/2;
  let n=Math.max(1,Math.round(blockFront/ideal));
  let pF=blockFront/n;
  while (pF<minFront&&n>1){n--;pF=blockFront/n;}
  while (pF>maxFront)      {n++;pF=blockFront/n;}
  if (pF<minFront*0.8) return [];
  const out=[];
  for (let row=0;row<rows;row++) {
    for (let col=0;col<n;col++) {
      let px,py,pw,ph;
      if (landscape){px=bl.x+col*pF;py=bl.y+row*rowDepth;pw=pF;ph=rowDepth;}
      else          {px=bl.x+row*rowDepth;py=bl.y+col*pF;pw=rowDepth;ph=pF;}
      if (pw*ph>=minArea*0.7) out.push({x:px,y:py,w:pw,h:ph});
    }
  }
  return out;
}

// ── Clear ────────────────────────────────────────────────────────
function clearAll() {
  if (!confirm('Clear everything?')) return;
  saveSnap();
  boundary=null;roads=[];plots=[];selected=null;dragNode=null;hoverNode=null;
  refreshUI();draw();
}

// ── DXF Export ───────────────────────────────────────────────────
function exportDXF() {
  if (!boundary&&!plots.length&&!roads.length) {setMsg('Nothing to export.',false);return;}
  const L=[];
  const p=(...a)=>a.forEach(v=>L.push(v));
  p('0','SECTION','2','HEADER','9','$ACADVER','1','AC1015','9','$INSUNITS','70','6','0','ENDSEC');
  p('0','SECTION','2','TABLES','0','TABLE','2','LAYER','70','10');
  const lyr=(n,c)=>p('0','LAYER','2',n,'70','0','62',String(c),'6','CONTINUOUS');
  lyr('0',7);lyr('BOUNDARY',7);lyr('ROADS',30);lyr('PLOT-OUTLINE',5);lyr('PLOT-TEXT',2);lyr('ROAD-TEXT',3);
  p('0','ENDTAB','0','ENDSEC','0','SECTION','2','ENTITIES');

  const poly=(layer,pts)=>{
    p('0','LWPOLYLINE','8',layer,'90',String(pts.length),'70','1');
    pts.forEach(pt=>p('10',pt.x.toFixed(3),'20',pt.y.toFixed(3)));
  };
  const txt=(layer,x,y,h,s)=>{
    p('0','TEXT','8',layer,'10',x.toFixed(3),'20',y.toFixed(3),'30','0',
      '40',h.toFixed(3),'1',String(s),'72','1','11',x.toFixed(3),'21',y.toFixed(3),'31','0');
  };

  if (boundary) poly('BOUNDARY',boundary.points);
  roads.forEach(r=>{
    poly('ROADS',r.points);
    const c=centroid(r.points); txt('ROAD-TEXT',c.x,c.y,2,'ROAD');
  });
  plots.forEach(pl=>{
    poly('PLOT-OUTLINE',pl.points);
    const c=centroid(pl.points);
    const bb=bbox(pl.points);
    const fs=Math.min(1.8,bb.w*0.12,bb.h*0.12);
    txt('PLOT-TEXT',c.x,c.y+fs*1.4,fs*1.2,`Lot ${pl.num}`);
    txt('PLOT-TEXT',c.x,c.y,fs,`${pl.area} m\xB2`);
    txt('PLOT-TEXT',c.x,c.y-fs*1.4,fs*0.85,`${bb.w.toFixed(1)}m \xD7 ${bb.h.toFixed(1)}m`);
  });
  p('0','ENDSEC','0','EOF');
  const blob=new Blob([L.join('\n')],{type:'application/dxf'});
  const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(blob),download:'land-layout.dxf'});
  a.click(); URL.revokeObjectURL(a.href);
  setMsg('DXF exported.');
}

// ── UI list ───────────────────────────────────────────────────────
const COLORS=['#89b4fa','#cba6f7','#f38ba8','#fab387','#f9e2af','#a6e3a1','#94e2d5','#74c7ec'];
function pc(num){return COLORS[(num-1)%COLORS.length];}

function refreshUI() {
  const list=document.getElementById('plotList');
  list.innerHTML='';
  roads.forEach((r,i)=>{
    const bb=bbox(r.points);
    const d=document.createElement('div');
    d.className='plot-item'+(selected===r.id?' sel':'');
    d.onclick=()=>{selected=r.id;hoverNode=null;refreshUI();draw();};
    d.innerHTML=`<div class="plot-badge" style="background:#a6e3a1;color:#1e1e2e">R${i+1}</div>
      <div class="plot-info"><div class="plot-area-text">Road</div>
      <div class="plot-dim-text">${bb.w.toFixed(1)}&times;${bb.h.toFixed(1)} m</div></div>
      <button class="del-btn" onclick="event.stopPropagation();delRoad('${r.id}')">&#10005;</button>`;
    list.appendChild(d);
  });
  plots.forEach(pl=>{
    const bb=bbox(pl.points);
    const col=pc(pl.num);
    const d=document.createElement('div');
    d.className='plot-item'+(selected===pl.id?' sel':'');
    d.onclick=()=>{selected=pl.id;hoverNode=null;refreshUI();draw();};
    d.innerHTML=`<div class="plot-badge" style="background:${col};color:#1e1e2e">${pl.num}</div>
      <div class="plot-info"><div class="plot-area-text">${pl.area.toLocaleString()} m&#178;</div>
      <div class="plot-dim-text">${bb.w.toFixed(1)}&times;${bb.h.toFixed(1)} m</div></div>
      <button class="del-btn" onclick="event.stopPropagation();delPlot('${pl.id}')">&#10005;</button>`;
    list.appendChild(d);
  });

  const sa=boundary?Math.round(polyArea(boundary.points)):0;
  const ra=Math.round(roads.reduce((s,r)=>s+polyArea(r.points),0));
  const pa=plots.reduce((s,p)=>s+p.area,0);
  const avg=plots.length?Math.round(pa/plots.length):0;
  document.getElementById('summary').innerHTML=boundary?`
    <div class="summary-grid">
      <span class="lbl">Site area</span><span class="val">${sa.toLocaleString()} m&#178;</span>
      <span class="lbl">Road area</span><span class="val">${ra.toLocaleString()} m&#178;</span>
      <span class="lbl">Lot area</span><span class="val">${pa.toLocaleString()} m&#178;</span>
      <span class="lbl">Lots</span><span class="val">${plots.length}</span>
      ${plots.length?`<span class="lbl">Avg lot</span><span class="val">${avg.toLocaleString()} m&#178;</span>`:''}
    </div>`:`<div style="font-size:11px;color:#585b70">Draw a site boundary to begin.</div>`;
  document.getElementById('st-lots').textContent=plots.length;
}

function delRoad(id) {
  saveSnap(); roads=roads.filter(r=>r.id!==id);
  if (selected===id){selected=null;dragNode=null;hoverNode=null;}
  refreshUI();draw();
}
function delPlot(id) {
  saveSnap(); plots=plots.filter(p=>p.id!==id);
  if (selected===id){selected=null;dragNode=null;hoverNode=null;}
  refreshUI();draw();
}

// ── Rendering ────────────────────────────────────────────────────
function drawPoly(pts, fill, stroke, lw, dash=[]) {
  ctx.beginPath();
  pts.forEach((pt,i)=>{const s=w2s(pt.x,pt.y);i===0?ctx.moveTo(s.x,s.y):ctx.lineTo(s.x,s.y);});
  ctx.closePath();
  ctx.fillStyle=fill; ctx.fill();
  ctx.setLineDash(dash); ctx.strokeStyle=stroke; ctx.lineWidth=lw; ctx.stroke();
  ctx.setLineDash([]);
}

function drawHandles(pts) {
  const NR=5;
  pts.forEach((pt,i)=>{
    const s=w2s(pt.x,pt.y);
    const isHov=hoverNode&&hoverNode.nodeIdx===i;
    const isDrg=dragNode&&dragNode.nodeIdx===i;
    const r=(isHov||isDrg)?NR+2:NR;
    ctx.fillStyle  =isDrg?'#f9e2af':isHov?'#cba6f7':'#ffffff';
    ctx.strokeStyle=isDrg?'#f59e0b':isHov?'#89b4fa':'#89b4fa';
    ctx.lineWidth=1.5;
    ctx.fillRect(s.x-r,s.y-r,r*2,r*2);
    ctx.strokeRect(s.x-r,s.y-r,r*2,r*2);
    if (isHov) {
      ctx.fillStyle='#cdd6f4'; ctx.font='9px monospace'; ctx.textAlign='left';
      ctx.fillText(`${pt.x.toFixed(1)},${pt.y.toFixed(1)}`,s.x+r+3,s.y+3);
    }
  });
}

function draw() {
  const W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0f0f1a'; ctx.fillRect(0,0,W,H);
  drawGrid(W,H);

  // Boundary
  if (boundary) {
    const isSel=selected===boundary.id;
    drawPoly(boundary.points,'#ffffff06',isSel?'#89b4fa':'#89b4fa88',isSel?2:1.5,[8,4]);
    const bb=bbox(boundary.points);
    const s=w2s(bb.x,bb.y);
    ctx.fillStyle='#89b4fa55'; ctx.font='11px Segoe UI';
    ctx.textAlign='left'; ctx.fillText('SITE BOUNDARY',s.x+5,s.y+14);
    if (isSel) drawHandles(boundary.points);
  }

  // Roads
  for (const r of roads) {
    const isSel=selected===r.id;
    drawPoly(r.points,isSel?'#a6e3a130':'#a6e3a118',isSel?'#a6e3a1':'#a6e3a170',isSel?2:1);
    const c=centroid(r.points); const sc=w2s(c.x,c.y);
    const bb=bbox(r.points);
    if (bb.w*scale>20&&bb.h*scale>12) {
      ctx.fillStyle='#a6e3a199';
      ctx.font=`${Math.max(9,Math.min(13,scale*1.2))}px Segoe UI`;
      ctx.textAlign='center'; ctx.fillText('ROAD',sc.x,sc.y+4);
    }
    if (isSel) drawHandles(r.points);
  }

  // Plots
  for (const pl of plots) {
    const col=pc(pl.num); const isSel=selected===pl.id;
    drawPoly(pl.points,isSel?col+'38':col+'18',isSel?col:col+'aa',isSel?2.5:1.5);
    const c=centroid(pl.points); const sc=w2s(c.x,c.y);
    const bb=bbox(pl.points); const sw=bb.w*scale,sh=bb.h*scale;
    if (sw>22&&sh>16) {
      ctx.textAlign='center';
      const fs=Math.min(14,sw*0.28,sh*0.28);
      ctx.font=`bold ${fs}px Segoe UI`; ctx.fillStyle=col;
      ctx.fillText(`Lot ${pl.num}`,sc.x,sc.y+(sh>42?-fs*0.6:4));
      if (sh>42&&sw>36) {
        ctx.font=`${Math.max(8,fs*0.78)}px Segoe UI`; ctx.fillStyle=col+'cc';
        ctx.fillText(`${pl.area.toLocaleString()} m²`,sc.x,sc.y+fs*0.7);
        if (sh>60) {
          ctx.font=`${Math.max(7,fs*0.65)}px Segoe UI`; ctx.fillStyle=col+'88';
          ctx.fillText(`${bb.w.toFixed(1)}×${bb.h.toFixed(1)}m`,sc.x,sc.y+fs*1.8);
        }
      }
    }
    if (isSel) drawHandles(pl.points);
  }

  // Ghost preview while drawing
  if (drawing&&dStart&&dCur) {
    const s=w2s(dStart.wx,dStart.wy),e=w2s(dCur.wx,dCur.wy);
    const rx=Math.min(s.x,e.x),ry=Math.min(s.y,e.y);
    const rw=Math.abs(e.x-s.x),rh=Math.abs(e.y-s.y);
    const col=(tool==='road-h'||tool==='road-v')?'#a6e3a1':tool==='plot'?'#cba6f7':'#89b4fa';
    ctx.fillStyle=col+'22'; ctx.fillRect(rx,ry,rw,rh);
    ctx.strokeStyle=col; ctx.lineWidth=1.5; ctx.setLineDash([5,3]);
    ctx.strokeRect(rx,ry,rw,rh); ctx.setLineDash([]);
    const wm=Math.abs(dCur.wx-dStart.wx),hm=Math.abs(dCur.wy-dStart.wy);
    ctx.fillStyle=col; ctx.font='11px Segoe UI'; ctx.textAlign='center';
    ctx.fillText(`${wm.toFixed(1)} × ${hm.toFixed(1)} m`,rx+rw/2,ry-6);
  }
  ctx.textAlign='left';

  drawScaleBar(W,H);
}

function drawGrid(W,H) {
  const sizes=[0.5,1,2,5,10,20,50,100,200,500];
  const gm=sizes.find(g=>g*scale>=55)||500;
  const wL=(0-offX)/scale,wR=(W-offX)/scale;
  const wT=(0-offY)/scale,wB=(H-offY)/scale;
  const sx0=Math.floor(wL/gm)*gm,sy0=Math.floor(wT/gm)*gm;
  ctx.strokeStyle='#ffffff0d'; ctx.lineWidth=1;
  for (let wx=sx0;wx<=wR+gm;wx+=gm){
    const x=wx*scale+offX; ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
  }
  for (let wy=sy0;wy<=wB+gm;wy+=gm){
    const y=wy*scale+offY; ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }
  ctx.fillStyle='#ffffff22'; ctx.font='9px monospace'; ctx.textAlign='left';
  for (let wx=sx0;wx<=wR+gm;wx+=gm){const x=wx*scale+offX;if(x>2&&x<W-20)ctx.fillText(wx+'m',x+2,H-4);}
  for (let wy=sy0;wy<=wB+gm;wy+=gm){const y=wy*scale+offY;if(y>12&&y<H-2)ctx.fillText(wy+'m',2,y-2);}
}

function drawScaleBar(W,H) {
  const tgts=[1,2,5,10,20,50,100,200,500,1000];
  const nm=tgts.find(v=>v*scale>=80)||1000;
  const bpx=nm*scale; const bx=W-bpx-14,by=H-28;
  ctx.fillStyle='#00000070'; ctx.fillRect(bx-4,by-14,bpx+20,22);
  ctx.fillStyle='#888'; ctx.fillRect(bx,by,bpx,5);
  ctx.fillStyle='#fff'; ctx.fillRect(bx,by,bpx/2,5);
  ctx.fillStyle='#fff'; ctx.font='10px monospace'; ctx.textAlign='center';
  ctx.fillText('0',bx,by-3); ctx.fillText(nm+'m',bx+bpx,by-3);
  document.getElementById('st-scale').textContent=`1:${Math.round(1000/scale)}`;
}

// ── Mouse ─────────────────────────────────────────────────────────
function getPos(e){const r=canvas.getBoundingClientRect();return{sx:e.clientX-r.left,sy:e.clientY-r.top};}

canvas.addEventListener('mousedown',e=>{
  const{sx,sy}=getPos(e);
  const{wx,wy}=s2w(sx,sy);

  // Middle-click / right-click / space → pan
  if (e.button===1||e.button===2||(spaceDown&&e.button===0)||tool==='pan'){
    panning=true; panStart={sx,sy,ox:offX,oy:offY};
    wrap.style.cursor='grabbing'; return;
  }
  if (e.button!==0) return;

  if (tool==='select') {
    // Check if clicking a node handle of selected item first
    const ni=nodeAt(sx,sy);
    if (ni!==null) {
      saveSnap();
      dragNode={itemId:selected,nodeIdx:ni};
      return;
    }
    // Otherwise pick an item
    let found=null;
    for (const pl of [...plots].reverse()) if(ptInPoly(wx,wy,pl.points)){found=pl.id;break;}
    if (!found) for (const r of [...roads].reverse()) if(ptInPoly(wx,wy,r.points)){found=r.id;break;}
    if (!found&&boundary&&ptInPoly(wx,wy,boundary.points)) found=boundary.id;
    selected=found; hoverNode=null;
    refreshUI(); draw();
    return;
  }

  drawing=true;
  dStart={wx:snap(wx),wy:snap(wy)};
  dCur={...dStart};
});

canvas.addEventListener('mousemove',e=>{
  const{sx,sy}=getPos(e);
  const{wx,wy}=s2w(sx,sy);
  document.getElementById('st-cursor').textContent=`${wx.toFixed(1)}, ${wy.toFixed(1)} m`;
  document.getElementById('coordInfo').textContent=`${wx.toFixed(2)}, ${wy.toFixed(2)} m`;

  if (panning){offX=panStart.ox+(sx-panStart.sx);offY=panStart.oy+(sy-panStart.sy);draw();return;}

  if (dragNode) {
    const item=findItem(dragNode.itemId);
    if (item) {
      item.points[dragNode.nodeIdx]={x:snap(wx),y:snap(wy)};
      const pl=plots.find(p=>p.id===dragNode.itemId);
      if (pl) pl.area=Math.round(polyArea(pl.points));
      refreshUI(); draw();
    }
    return;
  }

  // Update hover-node highlight when select tool is active
  if (tool==='select'&&selected) {
    const ni=nodeAt(sx,sy);
    const prevIdx=hoverNode?hoverNode.nodeIdx:-1;
    hoverNode=ni!==null?{itemId:selected,nodeIdx:ni}:null;
    wrap.style.cursor=ni!==null?'move':'default';
    if ((hoverNode?hoverNode.nodeIdx:-1)!==prevIdx) draw();
  }

  if (drawing){dCur={wx:snap(wx),wy:snap(wy)};draw();}
});

canvas.addEventListener('mouseup',e=>{
  if (panning){
    panning=false;
    wrap.style.cursor=tool==='pan'?'grab':tool==='select'?'default':'crosshair';
    return;
  }
  if (dragNode){dragNode=null;return;}
  if (!drawing) return;
  drawing=false;
  if (!dStart||!dCur) return;

  const p=getP();
  let x=Math.min(dStart.wx,dCur.wx),y=Math.min(dStart.wy,dCur.wy);
  let w=Math.abs(dCur.wx-dStart.wx),h=Math.abs(dCur.wy-dStart.wy);

  if (tool==='boundary') {
    if (w<1||h<1) return;
    saveSnap();
    boundary={id:uid(),points:rectPts(x,y,w,h)};
    plots=[];
    setMsg(`Site boundary: ${Math.round(w*h).toLocaleString()} m²`);

  } else if (tool==='road-h') {
    const cy=(dStart.wy+dCur.wy)/2;
    let ry=snap(cy)-p.roadW/2,rh=p.roadW,rx=x,rw=w;
    if (rw<1) return;
    if (boundary){
      const bb=bbox(boundary.points);
      rx=Math.max(rx,bb.x); rw=Math.min(x+w,bb.x+bb.w)-rx;
      ry=Math.max(ry,bb.y); rh=Math.min(rh,bb.y+bb.h-ry);
    }
    if (rw<0.5||rh<0.1) return;
    saveSnap(); roads.push({id:uid(),points:rectPts(rx,ry,rw,rh),dir:'h'});
    setMsg(`Horizontal road: ${rw.toFixed(1)} × ${rh.toFixed(1)} m`);

  } else if (tool==='road-v') {
    const cx=(dStart.wx+dCur.wx)/2;
    let rx=snap(cx)-p.roadW/2,rw=p.roadW,ry=y,rh=h;
    if (rh<1) return;
    if (boundary){
      const bb=bbox(boundary.points);
      ry=Math.max(ry,bb.y); rh=Math.min(y+h,bb.y+bb.h)-ry;
      rx=Math.max(rx,bb.x); rw=Math.min(rw,bb.x+bb.w-rx);
    }
    if (rh<0.5||rw<0.1) return;
    saveSnap(); roads.push({id:uid(),points:rectPts(rx,ry,rw,rh),dir:'v'});
    setMsg(`Vertical road: ${rw.toFixed(1)} × ${rh.toFixed(1)} m`);

  } else if (tool==='plot') {
    if (w<p.minFront*0.5||h<p.minDepth*0.5) return;
    const area=Math.round(w*h);
    const maxN=plots.length?Math.max(...plots.map(pl=>pl.num))+1:p.startN;
    saveSnap(); plots.push({id:uid(),num:maxN,points:rectPts(x,y,w,h),area,manual:true});
    setMsg(`Lot ${maxN}: ${area.toLocaleString()} m²`);
  }

  dStart=null; dCur=null;
  refreshUI(); draw();
});

canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const{sx,sy}=getPos(e);
  const f=e.deltaY<0?1.13:0.87;
  const ns=Math.max(0.3,Math.min(300,scale*f));
  const{wx,wy}=s2w(sx,sy);
  scale=ns; offX=sx-wx*scale; offY=sy-wy*scale;
  draw();
},{passive:false});

canvas.addEventListener('contextmenu',e=>e.preventDefault());

// ── Keyboard ─────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if (e.target.tagName==='INPUT') return;
  if (e.code==='Space'){spaceDown=true;e.preventDefault();}
  if ((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo();}
  if ((e.ctrlKey||e.metaKey)&&e.key==='y'){e.preventDefault();redo();}
  if (e.key==='s') setTool('select');
  if (e.key==='b') setTool('boundary');
  if (e.key==='h') setTool('road-h');
  if (e.key==='v') setTool('road-v');
  if (e.key==='p') setTool('plot');
  if (e.key==='f') fitView();
  if (e.key==='Escape'){selected=null;dragNode=null;hoverNode=null;refreshUI();draw();}
  if ((e.key==='Delete'||e.key==='Backspace')&&selected&&!dragNode){
    saveSnap();
    plots=plots.filter(pl=>pl.id!==selected);
    roads=roads.filter(r=>r.id!==selected);
    if (boundary&&boundary.id===selected) boundary=null;
    selected=null; refreshUI(); draw();
  }
});
document.addEventListener('keyup',e=>{if(e.code==='Space')spaceDown=false;});

// ── Fit view ──────────────────────────────────────────────────────
function fitView(){
  const W=canvas.width,H=canvas.height;
  if (!boundary){scale=8;offX=80;offY=80;draw();return;}
  const bb=bbox(boundary.points);
  const pad=60;
  scale=Math.min((W-pad*2)/bb.w,(H-pad*2)/bb.h,30);
  offX=(W-bb.w*scale)/2-bb.x*scale;
  offY=(H-bb.h*scale)/2-bb.y*scale;
  draw();
}

// ── Resize ────────────────────────────────────────────────────────
function resize(){canvas.width=wrap.clientWidth;canvas.height=wrap.clientHeight;draw();}
window.addEventListener('resize',resize);

// ── Globals ───────────────────────────────────────────────────────
window.T={setTool,autoLayout,clearAll,exportDXF,undo,redo,fitView};
window.delRoad=delRoad;
window.delPlot=delPlot;

// ── Boot ──────────────────────────────────────────────────────────
saveSnap(); resize(); refreshUI();
setMsg('Select a shape to drag its corner nodes. Draw boundary → roads → Auto-Layout.');
</script>
</body>
</html>
