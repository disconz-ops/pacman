<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Land Plot Layout Tool</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #1e1e2e;
  color: #cdd6f4;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

header {
  background: #181825;
  border-bottom: 1px solid #313244;
  padding: 7px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
  user-select: none;
}
header h1 {
  font-size: 13px;
  font-weight: 700;
  color: #89b4fa;
  letter-spacing: 0.3px;
}
.sep { width: 1px; height: 20px; background: #313244; }

button {
  background: #313244;
  color: #cdd6f4;
  border: 1px solid #45475a;
  padding: 4px 11px;
  border-radius: 4px;
  font-size: 11px;
  cursor: pointer;
  transition: background 0.1s, border-color 0.1s;
  white-space: nowrap;
}
button:hover { background: #45475a; }
button.primary { background: #89b4fa; color: #1e1e2e; border-color: #89b4fa; font-weight: 600; }
button.primary:hover { background: #74c7ec; border-color: #74c7ec; }
button.danger { background: transparent; color: #f38ba8; border-color: #f38ba8; }
button.danger:hover { background: #f38ba820; }
.header-right { margin-left: auto; display: flex; gap: 6px; }

.main { display: flex; flex: 1; overflow: hidden; }

.sidebar-left {
  width: 52px;
  background: #181825;
  border-right: 1px solid #313244;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px 0;
  gap: 2px;
  flex-shrink: 0;
}
.tool-btn {
  width: 38px; height: 38px;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  background: transparent;
  border: 1px solid transparent;
  padding: 0;
  font-size: 17px;
  color: #6c7086;
  transition: all 0.1s;
  position: relative;
}
.tool-btn:hover { background: #313244; color: #cdd6f4; border-color: #45475a; }
.tool-btn.active { background: #89b4fa22; color: #89b4fa; border-color: #89b4fa66; }
.tool-tip {
  position: absolute;
  left: 46px; top: 50%;
  transform: translateY(-50%);
  background: #313244;
  color: #cdd6f4;
  border: 1px solid #45475a;
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 11px;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.1s;
  z-index: 200;
}
.tool-btn:hover .tool-tip { opacity: 1; }
.tool-div { width: 30px; height: 1px; background: #313244; margin: 4px 0; }

.canvas-wrap {
  flex: 1;
  position: relative;
  overflow: hidden;
  background: #11111b;
}
#canvas { display: block; }
.coord-info {
  position: absolute; bottom: 8px; left: 8px;
  background: #181825cc;
  border: 1px solid #313244;
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 11px;
  color: #6c7086;
  pointer-events: none;
  font-family: monospace;
}

.sidebar-right {
  width: 256px;
  background: #181825;
  border-left: 1px solid #313244;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  flex-shrink: 0;
}
.panel { border-bottom: 1px solid #313244; }
.panel-hdr {
  padding: 7px 12px;
  font-size: 10px;
  font-weight: 700;
  color: #6c7086;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  background: #181825;
}
.panel-body { padding: 8px 12px; }

.param-row {
  display: flex; align-items: center;
  margin-bottom: 5px; gap: 6px;
}
.param-row label { font-size: 11px; color: #a6adc8; flex: 1; min-width: 0; }
.param-row input[type="number"] {
  width: 64px;
  background: #313244; border: 1px solid #45475a;
  color: #cdd6f4; padding: 3px 6px;
  border-radius: 3px; font-size: 11px;
  flex-shrink: 0;
}
.param-row input[type="number"]:focus { outline: none; border-color: #89b4fa; }
.param-unit { font-size: 10px; color: #585b70; width: 18px; flex-shrink: 0; }

.summary-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 4px; font-size: 11px;
}
.summary-grid .lbl { color: #6c7086; }
.summary-grid .val { color: #cdd6f4; font-weight: 600; text-align: right; }

.plot-list-wrap { flex: 1; overflow-y: auto; }
.plot-item {
  display: flex; align-items: center;
  padding: 5px 10px; gap: 8px;
  cursor: pointer; font-size: 11px;
  transition: background 0.08s;
  border-bottom: 1px solid #1e1e2e;
}
.plot-item:hover { background: #252535; }
.plot-item.sel { background: #89b4fa12; }
.plot-badge {
  width: 24px; height: 24px; border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 10px; flex-shrink: 0;
}
.plot-info { flex: 1; min-width: 0; }
.plot-area-text { color: #cdd6f4; }
.plot-dim-text { color: #585b70; font-size: 10px; }
.del-btn {
  background: transparent; border: none; color: #585b70;
  font-size: 13px; padding: 1px 4px; cursor: pointer; border-radius: 2px;
}
.del-btn:hover { background: #f38ba820; color: #f38ba8; }

.statusbar {
  background: #181825; border-top: 1px solid #313244;
  padding: 3px 12px; font-size: 11px; color: #6c7086;
  display: flex; gap: 16px; flex-shrink: 0; align-items: center;
}
.statusbar .sv { color: #89b4fa; }
#status-msg { margin-left: auto; }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #45475a; border-radius: 3px; }
</style>
</head>
<body>

<header>
  <h1>Land Plot Layout Tool</h1>
  <div class="sep"></div>
  <button onclick="T.undo()">&#8617; Undo</button>
  <button onclick="T.redo()">&#8618; Redo</button>
  <button class="danger" onclick="T.clearAll()">&#128465; Clear</button>
  <div class="sep"></div>
  <button onclick="T.fitView()">&#9654; Fit View</button>
  <div class="header-right">
    <button class="primary" onclick="T.autoLayout()">&#9889; Auto-Layout Plots</button>
    <button onclick="T.exportDXF()">&#128208; Export DXF</button>
  </div>
</header>

<div class="main">
  <div class="sidebar-left">
    <button class="tool-btn active" id="tb-select" onclick="T.setTool('select')" title="">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
        <path d="M2 2l5 12 2-5 5-2z"/>
      </svg>
      <span class="tool-tip">Select &nbsp;[S]</span>
    </button>
    <div class="tool-div"></div>
    <button class="tool-btn" id="tb-boundary" onclick="T.setTool('boundary')">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="2" width="12" height="12" stroke-dasharray="3 1.5"/>
      </svg>
      <span class="tool-tip">Site Boundary &nbsp;[B]</span>
    </button>
    <div class="tool-div"></div>
    <button class="tool-btn" id="tb-road-h" onclick="T.setTool('road-h')">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
        <rect x="0" y="6" width="16" height="4" rx="1"/>
        <rect x="3" y="7.5" width="2" height="1" fill="#181825"/>
        <rect x="7" y="7.5" width="2" height="1" fill="#181825"/>
        <rect x="11" y="7.5" width="2" height="1" fill="#181825"/>
      </svg>
      <span class="tool-tip">Horizontal Road &nbsp;[H]</span>
    </button>
    <button class="tool-btn" id="tb-road-v" onclick="T.setTool('road-v')">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
        <rect x="6" y="0" width="4" height="16" rx="1"/>
        <rect x="7.5" y="3" width="1" height="2" fill="#181825"/>
        <rect x="7.5" y="7" width="1" height="2" fill="#181825"/>
        <rect x="7.5" y="11" width="1" height="2" fill="#181825"/>
      </svg>
      <span class="tool-tip">Vertical Road &nbsp;[V]</span>
    </button>
    <div class="tool-div"></div>
    <button class="tool-btn" id="tb-plot" onclick="T.setTool('plot')">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="2" y="2" width="12" height="12"/>
        <text x="8" y="10" font-size="6" text-anchor="middle" fill="currentColor" stroke="none">LOT</text>
      </svg>
      <span class="tool-tip">Manual Plot &nbsp;[P]</span>
    </button>
    <div class="tool-div"></div>
    <button class="tool-btn" id="tb-pan" onclick="T.setTool('pan')">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 1v3M8 12v3M1 8h3M12 8h3M8 6a2 2 0 100 4 2 2 0 000-4z"/>
      </svg>
      <span class="tool-tip">Pan &nbsp;[Space]</span>
    </button>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="canvas"></canvas>
    <div class="coord-info" id="coordInfo">0.0, 0.0 m</div>
  </div>

  <div class="sidebar-right">
    <div class="panel">
      <div class="panel-hdr">Parameters</div>
      <div class="panel-body">
        <div class="param-row"><label>Min Area</label><input type="number" id="p-minArea" value="300" min="1"><span class="param-unit">m²</span></div>
        <div class="param-row"><label>Max Area</label><input type="number" id="p-maxArea" value="800" min="1"><span class="param-unit">m²</span></div>
        <div class="param-row"><label>Min Frontage</label><input type="number" id="p-minFront" value="12" min="1"><span class="param-unit">m</span></div>
        <div class="param-row"><label>Max Frontage</label><input type="number" id="p-maxFront" value="25" min="1"><span class="param-unit">m</span></div>
        <div class="param-row"><label>Min Depth</label><input type="number" id="p-minDepth" value="20" min="1"><span class="param-unit">m</span></div>
        <div class="param-row"><label>Max Depth</label><input type="number" id="p-maxDepth" value="40" min="1"><span class="param-unit">m</span></div>
        <div class="param-row"><label>Road Width</label><input type="number" id="p-roadW" value="10" min="1"><span class="param-unit">m</span></div>
        <div class="param-row"><label>Lot # Start</label><input type="number" id="p-startN" value="1" min="1"><span class="param-unit"></span></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-hdr">Summary</div>
      <div class="panel-body" id="summary">
        <div style="font-size:11px;color:#585b70">Draw a site boundary to begin.</div>
      </div>
    </div>

    <div class="panel" style="flex:1;display:flex;flex-direction:column;border-bottom:none;overflow:hidden">
      <div class="panel-hdr">Lots &amp; Roads</div>
      <div class="plot-list-wrap" id="plotList"></div>
    </div>
  </div>
</div>

<div class="statusbar">
  <span>Tool: <span class="sv" id="st-tool">Select</span></span>
  <span>Cursor: <span class="sv" id="st-cursor">0.0, 0.0 m</span></span>
  <span>Lots: <span class="sv" id="st-lots">0</span></span>
  <span>Scale: <span class="sv" id="st-scale">1:500</span></span>
  <span id="status-msg"></span>
</div>

<script>
// ================================================================
// Land Plot Layout Tool  –  interactive canvas + DXF export
// ================================================================

const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
const wrap   = document.getElementById('canvasWrap');

// ── View state ──────────────────────────────────────────────────
let scale   = 8;   // px per metre
let offX    = 80;
let offY    = 80;

// ── Data ────────────────────────────────────────────────────────
let boundary = null;          // { x,y,w,h } in metres
let roads    = [];            // [{ id,x,y,w,h,dir }]
let plots    = [];            // [{ id,num,x,y,w,h,area,manual }]
let selected = null;          // id

// ── Interaction state ───────────────────────────────────────────
let tool     = 'select';
let drawing  = false;
let dStart   = null;          // { wx,wy }
let dCur     = null;          // { wx,wy }
let panning  = false;
let panStart = null;          // { sx,sy,ox,oy }
let spaceDown = false;

// ── History ─────────────────────────────────────────────────────
let history  = [];
let histIdx  = -1;

let _uid = 0;
function uid() { return 'u' + (++_uid); }

// ── Params ──────────────────────────────────────────────────────
function getP() {
  const g = id => +document.getElementById(id).value || 0;
  return {
    minArea:  g('p-minArea')  || 300,
    maxArea:  g('p-maxArea')  || 800,
    minFront: g('p-minFront') || 12,
    maxFront: g('p-maxFront') || 25,
    minDepth: g('p-minDepth') || 20,
    maxDepth: g('p-maxDepth') || 40,
    roadW:    g('p-roadW')    || 10,
    startN:   g('p-startN')   || 1,
  };
}

// ── Coord transforms ────────────────────────────────────────────
function w2s(wx, wy) { return { x: wx * scale + offX, y: wy * scale + offY }; }
function s2w(sx, sy) { return { wx: (sx - offX) / scale, wy: (sy - offY) / scale }; }
function snap(v, g = 0.5) { return Math.round(v / g) * g; }

// ── History ─────────────────────────────────────────────────────
function saveSnap() {
  const s = JSON.stringify({ boundary, roads, plots });
  history = history.slice(0, histIdx + 1);
  history.push(s);
  histIdx = history.length - 1;
}
function restoreSnap() {
  const s = JSON.parse(history[histIdx]);
  boundary = s.boundary; roads = s.roads; plots = s.plots;
  refreshUI(); draw();
}
function undo() { if (histIdx > 0) { histIdx--; restoreSnap(); } }
function redo() { if (histIdx < history.length - 1) { histIdx++; restoreSnap(); } }

// ── Tool management ─────────────────────────────────────────────
const toolNames = {
  select: 'Select', boundary: 'Site Boundary',
  'road-h': 'Horizontal Road', 'road-v': 'Vertical Road',
  plot: 'Manual Plot', pan: 'Pan'
};
function setTool(t) {
  tool = t;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('tb-' + t);
  if (btn) btn.classList.add('active');
  document.getElementById('st-tool').textContent = toolNames[t] || t;
  wrap.style.cursor = t === 'pan' ? 'grab' : t === 'select' ? 'default' : 'crosshair';
}

// ── Status message ───────────────────────────────────────────────
function setMsg(msg, ok = true) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.style.color = ok ? '#a6e3a1' : '#f38ba8';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.textContent = ''; }, 3500);
}

// ── Auto-layout algorithm ────────────────────────────────────────
function autoLayout() {
  if (!boundary) { setMsg('Draw a site boundary first.', false); return; }
  const p = getP();

  // Compute free blocks by subtracting each road from boundary
  let blocks = [{ x: boundary.x, y: boundary.y, w: boundary.w, h: boundary.h }];
  for (const road of roads) {
    const next = [];
    for (const bl of blocks) next.push(...subtractRect(bl, road));
    blocks = next;
  }
  blocks = blocks.filter(b => b.w >= p.minFront * 0.8 && b.h >= p.minDepth * 0.8);

  const newPlots = [];
  for (const bl of blocks) newPlots.push(...subdivideBlock(bl, p));

  // Renumber from startN
  newPlots.forEach((pl, i) => { pl.num = p.startN + i; });

  saveSnap();
  plots = newPlots;
  refreshUI(); draw();
  setMsg(`Auto-layout: ${newPlots.length} lot${newPlots.length !== 1 ? 's' : ''} created.`);
}

// Clip rectangle B out of rectangle A, returning up to 4 surrounding pieces
function subtractRect(a, b) {
  const ax1 = a.x, ax2 = a.x + a.w, ay1 = a.y, ay2 = a.y + a.h;
  const bx1 = b.x, bx2 = b.x + b.w, by1 = b.y, by2 = b.y + b.h;
  if (bx2 <= ax1 || bx1 >= ax2 || by2 <= ay1 || by1 >= ay2) return [a];

  const out = [];
  const ox1 = Math.max(ax1, bx1), ox2 = Math.min(ax2, bx2);
  if (bx1 > ax1) out.push({ x: ax1, y: ay1, w: bx1 - ax1, h: a.h });
  if (bx2 < ax2) out.push({ x: bx2, y: ay1, w: ax2 - bx2, h: a.h });
  if (by1 > ay1) out.push({ x: ox1, y: ay1, w: ox2 - ox1, h: by1 - ay1 });
  if (by2 < ay2) out.push({ x: ox1, y: by2, w: ox2 - ox1, h: ay2 - by2 });
  return out.filter(r => r.w > 0.1 && r.h > 0.1);
}

function subdivideBlock(bl, p) {
  const result = [];
  const { minFront, maxFront, minDepth, maxDepth, minArea } = p;

  // Choose orientation: plots face the longer edge (frontage along long side)
  // If block wider: frontage along X, depth along Y. If taller: frontage along Y, depth along X.
  const landscape = bl.w >= bl.h;
  const blockFront = landscape ? bl.w : bl.h;
  const blockDepth = landscape ? bl.h : bl.w;

  if (blockDepth < minDepth * 0.8) return [];

  // Back-to-back rows if block is deep enough
  const rows = (blockDepth >= maxDepth * 1.8) ? 2 : 1;
  const rowDepth = blockDepth / rows;
  if (rowDepth < minDepth * 0.8) return [];

  // Number of plots: aim for ideal frontage in the middle of range
  const idealFront = (minFront + maxFront) / 2;
  let n = Math.max(1, Math.round(blockFront / idealFront));
  let pFront = blockFront / n;
  while (pFront < minFront && n > 1) { n--; pFront = blockFront / n; }
  while (pFront > maxFront)          { n++; pFront = blockFront / n; }
  if (pFront < minFront * 0.8) return [];

  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < n; col++) {
      let px, py, pw, ph;
      if (landscape) {
        px = bl.x + col * pFront;
        py = bl.y + row * rowDepth;
        pw = pFront;
        ph = rowDepth;
      } else {
        px = bl.x + row * rowDepth;
        py = bl.y + col * pFront;
        pw = rowDepth;
        ph = pFront;
      }
      const area = pw * ph;
      if (area < minArea * 0.7) continue;
      result.push({ id: uid(), num: 0, x: px, y: py, w: pw, h: ph, area: Math.round(area), manual: false });
    }
  }
  return result;
}

// ── Clear ────────────────────────────────────────────────────────
function clearAll() {
  if (!confirm('Clear everything?')) return;
  saveSnap();
  boundary = null; roads = []; plots = []; selected = null;
  refreshUI(); draw();
}

// ── DXF Export ───────────────────────────────────────────────────
function exportDXF() {
  if (!boundary && plots.length === 0 && roads.length === 0) {
    setMsg('Nothing to export.', false); return;
  }
  const L = [];
  const push = (...a) => a.forEach(v => L.push(v));

  // HEADER
  push('0','SECTION','2','HEADER',
    '9','$ACADVER','1','AC1015',
    '9','$INSUNITS','70','6',
    '0','ENDSEC');

  // TABLES – layer definitions
  push('0','SECTION','2','TABLES','0','TABLE','2','LAYER','70','10');
  const defLayer = (name, color) =>
    push('0','LAYER','2',name,'70','0','62',String(color),'6','CONTINUOUS');
  defLayer('0',7);
  defLayer('BOUNDARY',7);
  defLayer('ROADS',30);
  defLayer('PLOT-OUTLINE',5);
  defLayer('PLOT-TEXT',2);
  defLayer('ROAD-TEXT',3);
  push('0','ENDTAB','0','ENDSEC');

  // ENTITIES
  push('0','SECTION','2','ENTITIES');

  const addPoly = (layer, x, y, w, h) => {
    push('0','LWPOLYLINE','8',layer,'90','4','70','1');
    push('10',x.toFixed(3),'20',y.toFixed(3));
    push('10',(x+w).toFixed(3),'20',y.toFixed(3));
    push('10',(x+w).toFixed(3),'20',(y+h).toFixed(3));
    push('10',x.toFixed(3),'20',(y+h).toFixed(3));
  };
  const addText = (layer, x, y, h, txt) => {
    push('0','TEXT','8',layer,
      '10',x.toFixed(3),'20',y.toFixed(3),'30','0',
      '40',h.toFixed(3),'1',String(txt),
      '72','1','11',x.toFixed(3),'21',y.toFixed(3),'31','0');
  };

  if (boundary) addPoly('BOUNDARY', boundary.x, boundary.y, boundary.w, boundary.h);

  roads.forEach((r, i) => {
    addPoly('ROADS', r.x, r.y, r.w, r.h);
    addText('ROAD-TEXT', r.x + r.w/2, r.y + r.h/2, 2, 'ROAD');
  });

  plots.forEach(pl => {
    addPoly('PLOT-OUTLINE', pl.x, pl.y, pl.w, pl.h);
    const cx = pl.x + pl.w / 2;
    const cy = pl.y + pl.h / 2;
    const fs = Math.min(1.8, pl.w * 0.12, pl.h * 0.12);
    addText('PLOT-TEXT', cx, cy + fs * 1.4, fs * 1.2, `Lot ${pl.num}`);
    addText('PLOT-TEXT', cx, cy,             fs,       `${pl.area} m\xB2`);
    addText('PLOT-TEXT', cx, cy - fs * 1.4, fs * 0.85,
      `${pl.w.toFixed(1)}m \xD7 ${pl.h.toFixed(1)}m`);
  });

  push('0','ENDSEC','0','EOF');

  const blob = new Blob([L.join('\n')], { type: 'application/dxf' });
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(blob), download: 'land-layout.dxf'
  });
  a.click();
  URL.revokeObjectURL(a.href);
  setMsg('DXF file exported.');
}

// ── UI refresh ───────────────────────────────────────────────────
const PLOT_COLORS = ['#89b4fa','#cba6f7','#f38ba8','#fab387','#f9e2af','#a6e3a1','#94e2d5','#74c7ec'];
function pc(num) { return PLOT_COLORS[(num - 1) % PLOT_COLORS.length]; }

function refreshUI() {
  const list = document.getElementById('plotList');
  list.innerHTML = '';

  roads.forEach((r, i) => {
    const div = document.createElement('div');
    div.className = 'plot-item' + (selected === r.id ? ' sel' : '');
    div.onclick = () => { selected = r.id; refreshUI(); draw(); };
    div.innerHTML = `
      <div class="plot-badge" style="background:#a6e3a1;color:#1e1e2e">R${i+1}</div>
      <div class="plot-info">
        <div class="plot-area-text">Road</div>
        <div class="plot-dim-text">${r.w.toFixed(1)}&times;${r.h.toFixed(1)} m</div>
      </div>
      <button class="del-btn" onclick="event.stopPropagation();delRoad('${r.id}')">&#10005;</button>
    `;
    list.appendChild(div);
  });

  plots.forEach(pl => {
    const col = pc(pl.num);
    const div = document.createElement('div');
    div.className = 'plot-item' + (selected === pl.id ? ' sel' : '');
    div.onclick = () => { selected = pl.id; refreshUI(); draw(); };
    div.innerHTML = `
      <div class="plot-badge" style="background:${col};color:#1e1e2e">${pl.num}</div>
      <div class="plot-info">
        <div class="plot-area-text">${pl.area.toLocaleString()} m&sup2;</div>
        <div class="plot-dim-text">${pl.w.toFixed(1)}&times;${pl.h.toFixed(1)} m</div>
      </div>
      <button class="del-btn" onclick="event.stopPropagation();delPlot('${pl.id}')">&#10005;</button>
    `;
    list.appendChild(div);
  });

  // Summary
  const siteArea  = boundary ? Math.round(boundary.w * boundary.h) : 0;
  const roadArea  = Math.round(roads.reduce((s,r) => s + r.w*r.h, 0));
  const plotArea  = plots.reduce((s,p) => s + p.area, 0);
  const avgPlot   = plots.length ? Math.round(plotArea / plots.length) : 0;
  document.getElementById('summary').innerHTML = boundary ? `
    <div class="summary-grid">
      <span class="lbl">Site area</span><span class="val">${siteArea.toLocaleString()} m&sup2;</span>
      <span class="lbl">Road area</span><span class="val">${roadArea.toLocaleString()} m&sup2;</span>
      <span class="lbl">Lot area</span><span class="val">${plotArea.toLocaleString()} m&sup2;</span>
      <span class="lbl">Lots</span><span class="val">${plots.length}</span>
      ${plots.length ? `<span class="lbl">Avg lot</span><span class="val">${avgPlot.toLocaleString()} m&sup2;</span>` : ''}
    </div>
  ` : '<div style="font-size:11px;color:#585b70">Draw a site boundary to begin.</div>';

  document.getElementById('st-lots').textContent = plots.length;
}

function delRoad(id) {
  saveSnap(); roads = roads.filter(r => r.id !== id);
  if (selected === id) selected = null;
  refreshUI(); draw();
}
function delPlot(id) {
  saveSnap(); plots = plots.filter(p => p.id !== id);
  if (selected === id) selected = null;
  refreshUI(); draw();
}

// ── Rendering ────────────────────────────────────────────────────
function draw() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  // Background
  ctx.fillStyle = '#0f0f1a';
  ctx.fillRect(0, 0, W, H);

  drawGrid(W, H);

  // Boundary
  if (boundary) {
    const s = w2s(boundary.x, boundary.y);
    const e = w2s(boundary.x + boundary.w, boundary.y + boundary.h);
    ctx.fillStyle   = '#ffffff06';
    ctx.fillRect(s.x, s.y, e.x - s.x, e.y - s.y);
    ctx.strokeStyle = '#89b4fa';
    ctx.lineWidth   = 2;
    ctx.setLineDash([8, 4]);
    ctx.strokeRect(s.x, s.y, e.x - s.x, e.y - s.y);
    ctx.setLineDash([]);
    ctx.fillStyle = '#89b4fa55';
    ctx.font = '11px Segoe UI';
    ctx.fillText('SITE BOUNDARY', s.x + 5, s.y + 14);
  }

  // Roads
  for (const r of roads) {
    const s = w2s(r.x, r.y), e = w2s(r.x + r.w, r.y + r.h);
    const sw = e.x - s.x, sh = e.y - s.y;
    const isSel = selected === r.id;
    ctx.fillStyle   = isSel ? '#a6e3a130' : '#a6e3a118';
    ctx.fillRect(s.x, s.y, sw, sh);
    ctx.strokeStyle = isSel ? '#a6e3a1' : '#a6e3a170';
    ctx.lineWidth   = isSel ? 2 : 1;
    ctx.strokeRect(s.x, s.y, sw, sh);
    if (sw > 20 && sh > 12) {
      ctx.fillStyle = '#a6e3a199';
      ctx.font = `${Math.max(9, Math.min(13, scale * 1.2))}px Segoe UI`;
      ctx.textAlign = 'center';
      ctx.fillText('ROAD', s.x + sw / 2, s.y + sh / 2 + 4);
      ctx.textAlign = 'left';
    }
  }

  // Plots
  for (const pl of plots) {
    const s = w2s(pl.x, pl.y), e = w2s(pl.x + pl.w, pl.y + pl.h);
    const sw = e.x - s.x, sh = e.y - s.y;
    const col = pc(pl.num);
    const isSel = selected === pl.id;
    ctx.fillStyle   = isSel ? col + '38' : col + '18';
    ctx.fillRect(s.x, s.y, sw, sh);
    ctx.strokeStyle = isSel ? col : col + 'aa';
    ctx.lineWidth   = isSel ? 2.5 : 1.5;
    ctx.strokeRect(s.x, s.y, sw, sh);

    if (sw > 22 && sh > 16) {
      ctx.textAlign = 'center';
      const cx = s.x + sw / 2, cy = s.y + sh / 2;
      const fs = Math.min(14, sw * 0.28, sh * 0.28);
      ctx.font = `bold ${fs}px Segoe UI`;
      ctx.fillStyle = col;
      ctx.fillText(`Lot ${pl.num}`, cx, cy + (sh > 42 ? -fs * 0.6 : 4));
      if (sh > 42 && sw > 36) {
        ctx.font = `${Math.max(8, fs * 0.78)}px Segoe UI`;
        ctx.fillStyle = col + 'cc';
        ctx.fillText(`${pl.area.toLocaleString()} m²`, cx, cy + fs * 0.7);
        if (sh > 60) {
          ctx.font = `${Math.max(7, fs * 0.65)}px Segoe UI`;
          ctx.fillStyle = col + '88';
          ctx.fillText(`${pl.w.toFixed(1)}×${pl.h.toFixed(1)}m`, cx, cy + fs * 1.8);
        }
      }
      ctx.textAlign = 'left';
    }
  }

  // Ghost rectangle while drawing
  if (drawing && dStart && dCur) {
    const s = w2s(dStart.wx, dStart.wy), e = w2s(dCur.wx, dCur.wy);
    const rx = Math.min(s.x, e.x), ry = Math.min(s.y, e.y);
    const rw = Math.abs(e.x - s.x), rh = Math.abs(e.y - s.y);
    const col = (tool === 'road-h' || tool === 'road-v') ? '#a6e3a1'
               : tool === 'plot' ? '#cba6f7' : '#89b4fa';
    ctx.fillStyle   = col + '22';
    ctx.fillRect(rx, ry, rw, rh);
    ctx.strokeStyle = col;
    ctx.lineWidth   = 1.5;
    ctx.setLineDash([5, 3]);
    ctx.strokeRect(rx, ry, rw, rh);
    ctx.setLineDash([]);
    // dimension label
    const wm = Math.abs(dCur.wx - dStart.wx), hm = Math.abs(dCur.wy - dStart.wy);
    ctx.fillStyle = col;
    ctx.font = '11px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText(`${wm.toFixed(1)} × ${hm.toFixed(1)} m`, rx + rw / 2, ry - 6);
    ctx.textAlign = 'left';
  }

  drawScaleBar(W, H);
}

function drawGrid(W, H) {
  const sizes = [0.5,1,2,5,10,20,50,100,200,500];
  const gridM = sizes.find(g => g * scale >= 55) || 500;
  const wL = (0 - offX) / scale,  wR = (W - offX) / scale;
  const wT = (0 - offY) / scale,  wB = (H - offY) / scale;
  const startX = Math.floor(wL / gridM) * gridM;
  const startY = Math.floor(wT / gridM) * gridM;

  ctx.strokeStyle = '#ffffff0d'; ctx.lineWidth = 1;
  for (let wx = startX; wx <= wR + gridM; wx += gridM) {
    const sx = wx * scale + offX;
    ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); ctx.stroke();
  }
  for (let wy = startY; wy <= wB + gridM; wy += gridM) {
    const sy = wy * scale + offY;
    ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(W, sy); ctx.stroke();
  }

  // Axis labels
  ctx.fillStyle = '#ffffff22'; ctx.font = '9px monospace';
  for (let wx = startX; wx <= wR + gridM; wx += gridM) {
    const sx = wx * scale + offX;
    if (sx > 2 && sx < W - 20) ctx.fillText(wx + 'm', sx + 2, H - 4);
  }
  for (let wy = startY; wy <= wB + gridM; wy += gridM) {
    const sy = wy * scale + offY;
    if (sy > 12 && sy < H - 2) ctx.fillText(wy + 'm', 2, sy - 2);
  }
}

function drawScaleBar(W, H) {
  const targets = [1,2,5,10,20,50,100,200,500,1000];
  const niceM = targets.find(v => v * scale >= 80) || 1000;
  const barPx = niceM * scale;
  const bx = W - barPx - 14, by = H - 28;

  ctx.fillStyle = '#00000070';
  ctx.fillRect(bx - 4, by - 14, barPx + 20, 22);
  ctx.fillStyle = '#888'; ctx.fillRect(bx, by, barPx, 5);
  ctx.fillStyle = '#fff'; ctx.fillRect(bx, by, barPx / 2, 5);
  ctx.fillStyle = '#fff'; ctx.font = '10px monospace'; ctx.textAlign = 'center';
  ctx.fillText('0', bx, by - 3);
  ctx.fillText(niceM + 'm', bx + barPx, by - 3);
  ctx.textAlign = 'left';

  const ratio = Math.round(1000 / scale);
  document.getElementById('st-scale').textContent = `1:${ratio}`;
}

// ── Mouse events ─────────────────────────────────────────────────
function getPos(e) {
  const r = canvas.getBoundingClientRect();
  return { sx: e.clientX - r.left, sy: e.clientY - r.top };
}

canvas.addEventListener('mousedown', e => {
  const { sx, sy } = getPos(e);
  const { wx, wy } = s2w(sx, sy);

  if (e.button === 1 || e.button === 2 || (spaceDown && e.button === 0) || tool === 'pan') {
    panning = true;
    panStart = { sx, sy, ox: offX, oy: offY };
    wrap.style.cursor = 'grabbing';
    return;
  }
  if (e.button !== 0) return;

  if (tool === 'select') {
    let found = null;
    for (const pl of [...plots].reverse())
      if (wx >= pl.x && wx <= pl.x+pl.w && wy >= pl.y && wy <= pl.y+pl.h) { found = pl.id; break; }
    if (!found)
      for (const r of [...roads].reverse())
        if (wx >= r.x && wx <= r.x+r.w && wy >= r.y && wy <= r.y+r.h) { found = r.id; break; }
    selected = found;
    refreshUI(); draw();
    return;
  }

  drawing = true;
  dStart = { wx: snap(wx), wy: snap(wy) };
  dCur   = { ...dStart };
});

canvas.addEventListener('mousemove', e => {
  const { sx, sy } = getPos(e);
  const { wx, wy } = s2w(sx, sy);
  document.getElementById('st-cursor').textContent  = `${wx.toFixed(1)}, ${wy.toFixed(1)} m`;
  document.getElementById('coordInfo').textContent  = `${wx.toFixed(2)}, ${wy.toFixed(2)} m`;

  if (panning) {
    offX = panStart.ox + (sx - panStart.sx);
    offY = panStart.oy + (sy - panStart.sy);
    draw(); return;
  }
  if (drawing) {
    const p = getP();
    let snX = snap(wx), snY = snap(wy);
    // For road tools, constrain the cross-axis movement to show road width
    if (tool === 'road-h') snY = snap(wy);   // free vertical snap
    if (tool === 'road-v') snX = snap(wx);
    dCur = { wx: snX, wy: snY };
    draw();
  }
});

canvas.addEventListener('mouseup', e => {
  if (panning) {
    panning = false;
    wrap.style.cursor = tool === 'pan' ? 'grab' : tool === 'select' ? 'default' : 'crosshair';
    return;
  }
  if (!drawing) return;
  drawing = false;

  if (!dStart || !dCur) return;
  const p = getP();
  let x = Math.min(dStart.wx, dCur.wx);
  let y = Math.min(dStart.wy, dCur.wy);
  let w = Math.abs(dCur.wx - dStart.wx);
  let h = Math.abs(dCur.wy - dStart.wy);

  if (tool === 'boundary') {
    if (w < 1 || h < 1) return;
    saveSnap();
    boundary = { x, y, w, h };
    plots = [];   // clear old plots when boundary changes
    setMsg(`Site boundary: ${Math.round(w * h).toLocaleString()} m²`);

  } else if (tool === 'road-h') {
    // Horizontal road: user drags X extent; Y = drag midpoint; height = roadWidth
    const centerY = (dStart.wy + dCur.wy) / 2;
    let ry = snap(centerY) - p.roadW / 2;
    let rh = p.roadW;
    let rx = x, rw = w;
    if (rw < 1) return;
    if (boundary) {
      rx = Math.max(rx, boundary.x);
      rw = Math.min(x + w, boundary.x + boundary.w) - rx;
      ry = Math.max(ry, boundary.y);
      rh = Math.min(Math.min(rh, boundary.y + boundary.h - ry), p.roadW);
    }
    if (rw < 0.5 || rh < 0.1) return;
    saveSnap();
    roads.push({ id: uid(), x: rx, y: ry, w: rw, h: rh, dir: 'h' });
    setMsg(`Horizontal road: ${rw.toFixed(1)} × ${rh.toFixed(1)} m`);

  } else if (tool === 'road-v') {
    const centerX = (dStart.wx + dCur.wx) / 2;
    let rx = snap(centerX) - p.roadW / 2;
    let rw = p.roadW;
    let ry = y, rh = h;
    if (rh < 1) return;
    if (boundary) {
      ry = Math.max(ry, boundary.y);
      rh = Math.min(y + h, boundary.y + boundary.h) - ry;
      rx = Math.max(rx, boundary.x);
      rw = Math.min(Math.min(rw, boundary.x + boundary.w - rx), p.roadW);
    }
    if (rh < 0.5 || rw < 0.1) return;
    saveSnap();
    roads.push({ id: uid(), x: rx, y: ry, w: rw, h: rh, dir: 'v' });
    setMsg(`Vertical road: ${rw.toFixed(1)} × ${rh.toFixed(1)} m`);

  } else if (tool === 'plot') {
    if (w < p.minFront * 0.5 || h < p.minDepth * 0.5) return;
    const area = Math.round(w * h);
    const maxN = plots.length ? Math.max(...plots.map(pl => pl.num)) + 1 : p.startN;
    saveSnap();
    plots.push({ id: uid(), num: maxN, x, y, w, h, area, manual: true });
    setMsg(`Lot ${maxN}: ${area.toLocaleString()} m²`);
  }

  dStart = null; dCur = null;
  refreshUI(); draw();
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const { sx, sy } = getPos(e);
  const factor = e.deltaY < 0 ? 1.13 : 0.87;
  const newScale = Math.max(0.3, Math.min(300, scale * factor));
  const { wx, wy } = s2w(sx, sy);
  scale = newScale;
  offX  = sx - wx * scale;
  offY  = sy - wy * scale;
  draw();
}, { passive: false });

canvas.addEventListener('contextmenu', e => e.preventDefault());

// ── Keyboard ─────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { spaceDown = true; e.preventDefault(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'y') { e.preventDefault(); redo(); }
  if (e.key === 's') setTool('select');
  if (e.key === 'b') setTool('boundary');
  if (e.key === 'h') setTool('road-h');
  if (e.key === 'v') setTool('road-v');
  if (e.key === 'p') setTool('plot');
  if (e.key === 'Escape') { selected = null; refreshUI(); draw(); }
  if ((e.key === 'Delete' || e.key === 'Backspace') && selected) {
    saveSnap();
    plots = plots.filter(pl => pl.id !== selected);
    roads = roads.filter(r  => r.id  !== selected);
    selected = null;
    refreshUI(); draw();
  }
  if (e.key === 'f') fitView();
});
document.addEventListener('keyup', e => {
  if (e.code === 'Space') spaceDown = false;
});

// ── Fit view ─────────────────────────────────────────────────────
function fitView() {
  const W = canvas.width, H = canvas.height;
  if (!boundary) { scale = 8; offX = 80; offY = 80; draw(); return; }
  const pad = 60;
  scale = Math.min((W - pad*2) / boundary.w, (H - pad*2) / boundary.h, 30);
  offX  = (W - boundary.w * scale) / 2 - boundary.x * scale;
  offY  = (H - boundary.h * scale) / 2 - boundary.y * scale;
  draw();
}

// ── Resize ───────────────────────────────────────────────────────
function resize() {
  canvas.width  = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
  draw();
}
window.addEventListener('resize', resize);

// ── Expose globals ────────────────────────────────────────────────
window.T = { setTool, autoLayout, clearAll, exportDXF, undo, redo, fitView };
window.delRoad = delRoad;
window.delPlot = delPlot;

// ── Boot ─────────────────────────────────────────────────────────
saveSnap();
resize();
refreshUI();
setMsg('Tip: Draw a site boundary, add roads, then click Auto-Layout Plots.');
</script>
</body>
</html>
